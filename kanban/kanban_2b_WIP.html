<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      padding: 16px 24px;
      background: #1f2937;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 64px);
    }

    .column {
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 8px 8px 0 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .column-title {
      position: relative;
      cursor: help;
    }

    /* Tooltip */
    .column-title::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 0;
      top: 125%;
      background: #111827;
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 400;
      width: 260px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .column-title:hover::after {
      opacity: 1;
    }

    .counter {
      padding: 4px 10px;
      border-radius: 999px;
      background: #22c55e; /* green */
      color: #000000;      /* black */
      font-size: 0.8rem;
      font-weight: 700;
      min-width: 24px;
      text-align: centre;
    }

    .counter.over-limit {
      background: #dc2626; /* red */
      color: #000000;
    }

    .column-content {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .add-card {
      margin: 12px;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .add-card:hover { background: #1d4ed8; }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: grab;
    }

    .card textarea {
      width: 100%;
      border: none;
      resize: vertical;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .column-content.drag-over { background: #e0e7ff; }
  </style>
</head>
<body>
  <header>Kanban Board</header>

  <div class="board">

    <div class="column">
      <div class="column-header">
        <span class="column-title" data-tooltip="The Product Owner has to agree that this is relevant work for the team to do">To Do</span>
        <span class="counter">0</span>
      </div>
      <button class="add-card" onclick="addCard(this)">+ Add card</button>
      <div class="column-content" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <span class="column-title" data-tooltip="The Team and Product Owner need to agree on the priority and size of this job and if there is capacity to take it on">Doing</span>
        <span class="counter">0</span>
      </div>
      <div class="column-content" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <span class="column-title" data-tooltip="The Dev and Tester need to agree that Test Acceptance Criteria exists and that this is ready for test">Testing</span>
        <span class="counter">0</span>
      </div>
      <div class="column-content" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <span class="column-title" data-tooltip="Product Owner and Tester have to agree that it has tested completely. If not, it will be sent back to Doing via its acceptance policy">Finished</span>
        <span class="counter">0</span>
      </div>
      <div class="column-content" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
    </div>

    <div class="column">
      <div class="column-header">
        <span class="column-title" data-tooltip="Product Owner has to agree that this has been completed and necessary communications have been completed">Archive</span>
        <span class="counter">0</span>
      </div>
      <div class="column-content" ondragover="onDragOver(event)" ondrop="onDrop(event)"></div>
    </div>

  </div>

  <script>
    let draggedCard = null;

    function addCard(button) {
      const columnContent = button.nextElementSibling;
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;
      card.ondragstart = onDragStart;
      card.ondragend = onDragEnd;

      const textarea = document.createElement('textarea');
      textarea.placeholder = 'Enter task text…';
      textarea.rows = 3;

      card.appendChild(textarea);
      columnContent.appendChild(card);
      textarea.focus();
      updateCounters();
    }

    function onDragStart(event) {
      draggedCard = event.target;
      event.target.style.opacity = '0.5';
    }

    function onDragEnd(event) {
      event.target.style.opacity = '1';
      draggedCard = null;
      updateCounters();
    }

    function onDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function onDrop(event) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (draggedCard) event.currentTarget.appendChild(draggedCard);
    }

    function updateCounters() {
      document.querySelectorAll('.column').forEach(col => {
        const count = col.querySelectorAll('.card').length;
        const counter = col.querySelector('.counter');
        counter.textContent = count;
        counter.classList.toggle('over-limit', count > 3);
      });
    }
  </script>
</body>
</html>
